[pytest]
# 测试用例收集规则
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*

# 测试标记定义
markers =
    api: 接口自动化测试
    web: Web自动化测试
    app: APP自动化测试
    performance: 性能测试
    smoke: 冒烟测试
    regression: 回归测试
    critical: 关键测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 临时目录
# tmp_path_factory = pytest_tmpdir_factory

# 失败重试次数
# retries = 1

# 测试超时设置
# timeout = 300

# 排除目录
norecursedirs = .git .idea __pycache__ *.egg venv logs reports

# 测试用例顺序
# testorder = sorted

# 显示测试进度
# addopts = -v --progress

# allure报告配置
addopts = -v --alluredir=reports/allure-results --clean-alluredir

# 编码设置
# testpaths = cases

# 运行模式
# mode = auto
