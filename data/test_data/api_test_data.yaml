# API测试数据 - YAML格式
# OmniTest 自动化测试框架

# 用户注册测试数据
test_user_registration:
  # 有效数据
  valid_data:
    username: testuser123
    email: testuser123@example.com
    password: Test@123456
    phone: 13800138000
  
  # 无效数据场景
  invalid_data:
    # 缺少用户名
    missing_username:
      email: testuser123@example.com
      password: Test@123456
    
    # 无效邮箱格式
    invalid_email:
      username: testuser123
      email: invalid-email
      password: Test@123456
    
    # 弱密码
    weak_password:
      username: testuser123
      email: testuser123@example.com
      password: "123"
  
  # 预期结果
  expected:
    success_message: "User registered successfully"
    status_code: 201
    error_codes:
      missing_required_field: "MISSING_REQUIRED_FIELD"
      invalid_email_format: "INVALID_EMAIL_FORMAT"
      password_too_weak: "PASSWORD_TOO_WEAK"

# 用户登录测试数据
test_user_login:
  # 有效凭证
  valid_credentials:
    username: testuser123
    password: Test@123456
  
  # 无效凭证场景
  invalid_credentials:
    # 密码错误
    wrong_password:
      username: testuser123
      password: WrongPassword123
    
    # 用户不存在
    nonexistent_user:
      username: nonexistentuser
      password: Test@123456
  
  # 预期结果
  expected:
    success_message: "Login successful"
    status_code: 200
    error_messages:
      invalid_credentials: "Invalid username or password"
      account_locked: "Account locked due to multiple failed attempts"

# 获取用户信息测试数据
test_get_user_info:
  # 预期字段列表
  expected_fields:
    - id
    - username
    - email
    - phone
    - created_at
    - updated_at
  
  # 预期状态码
  expected_status_code: 200

# 更新用户信息测试数据
test_update_user_info:
  # 更新数据
  update_data:
    email: updatedemail123@example.com
    phone: 13900139000
  
  # 无效更新场景
  invalid_update:
    # 无效邮箱格式
    invalid_email:
      email: invalid-email
  
  # 预期结果
  expected:
    success_message: "User information updated successfully"
    status_code: 200
