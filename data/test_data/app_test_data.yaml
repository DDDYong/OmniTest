# APP测试数据 - YAML格式
# OmniTest 自动化测试框架

# 并行测试设备池配置
parallel_devices:
  - device_id: "emulator-5554"
    appium_port: 4723
    system_port: 8200
    mjpeg_server_port: 8090
    additional_caps:
      appium:ensureWebviewsHavePages: true
      appium:nativeWebScreenshot: true
      appium:connectHardwareKeyboard: true
      appium:skipDeviceInitialization: false
      appium:skipServerInstallation: false
      appium:uiautomator2ServerLaunchTimeout: 60000
      appium:uiautomator2ServerInstallTimeout: 60000
      appium:adbExecTimeout: 60000
      appium:androidInstallTimeout: 120000
  - device_id: "emulator-5556"
    appium_port: 4724
    system_port: 8201
    mjpeg_server_port: 8091
    additional_caps:
      appium:ensureWebviewsHavePages: true
      appium:nativeWebScreenshot: true
      appium:connectHardwareKeyboard: true
      appium:skipDeviceInitialization: false
      appium:skipServerInstallation: false
      appium:uiautomator2ServerLaunchTimeout: 60000
      appium:uiautomator2ServerInstallTimeout: 60000
      appium:adbExecTimeout: 60000
      appium:androidInstallTimeout: 120000

# Android应用测试配置（单设备模式，保持兼容）
android_app_test:
  # 设备能力配置
  device_capabilities:
    platformName: Android
    platformVersion: "16"
    deviceName: "emulator-5554"
    automationName: UiAutomator2
    noReset: false
    fullReset: false
    newCommandTimeout: 60
    unicodeKeyboard: true
    resetKeyboard: true
    appPackage: com.weixiao.voice
    appActivity: com.weixiao.voice/.ui.home.MainActivity
    appWaitActivity: com.weixiao.voice/.ui.home.MainActivity
    systemPort: 8202
    disableWindowAnimation: true
    dontStopAppOnReset: false
    adbPort: 5037
    skipUnlock: false  # 跳过解锁（如果设备已解锁）
    ignoreHiddenApiPolicyError: true  # 忽略隐藏 API 政策错误
  
  # Appium服务器配置
  appium_server:
    host: 127.0.0.1
    port: 4723
    timeout: 60
  
  # 等待设置
  wait_settings:
    implicit_wait: 10
    explicit_wait: 20
    polling_interval: 0.5
  
  # 应用路径
  app_paths:
    local_app_path: ~/Downloads/huaxuan_arm64-v8a_1.3.10.2_26020902_debug.apk
    remote_app_url: null
  
  # 预期结果
  expected_results:
    app_launches_successfully: true
    login_screen_displayed: true
    home_screen_displayed: true
    error_messages:
      app_not_installed: 应用未安装
      device_not_connected: 设备未连接
      appium_server_down: Appium服务未启动
      app_crash: 应用崩溃
  
  # 测试场景列表
  test_scenarios:
    - name: app_launch
      description: 启动应用并验证主界面
      priority: high
      steps:
        - 连接到Appium服务器
        - 启动安卓应用
        - 验证应用是否正常启动
        - 截图保存
      expected:
        activity: com.cola.xinyue.activity.LoginActivity
        package: com.weixiao.voice
        timeout: 30

    - name: login_flow
      description: 验证登录流程
      priority: high
      steps:
        - 启动应用
        - 输入用户名和密码
        - 点击登录按钮
        - 验证是否登录成功
      test_data:
        valid_username: testuser
        valid_password: password123
        invalid_username: wronguser
        invalid_password: wrongpass
      expected:
        success_message: 登录成功
        error_message: 用户名或密码错误

    - name: navigation_test
      description: 验证应用内导航功能
      priority: medium
      steps:
        - 启动应用
        - 导航到功能页面
        - 返回首页
      expected:
        navigation_completes: true
        back_button_works: true
  
  # 元素标识符
  element_identifiers:
    login_username_field:
      id: com.example.app:id/username_input
      xpath: "//android.widget.EditText[@resource-id='com.example.app:id/username_input']"
      class: android.widget.EditText
    
    login_password_field:
      id: com.example.app:id/password_input
      xpath: "//android.widget.EditText[@resource-id='com.example.app:id/password_input']"
      class: android.widget.EditText
    
    login_button:
      id: com.example.app:id/login_button
      xpath: "//android.widget.Button[@resource-id='com.example.app:id/login_button']"
      class: android.widget.Button
    
    home_screen_title:
      id: com.example.app:id/home_title
      xpath: "//android.widget.TextView[@resource-id='com.example.app:id/home_title']"
      class: android.widget.TextView
    
    menu_button:
      id: com.example.app:id/menu_button
      xpath: "//android.widget.ImageButton[@resource-id='com.example.app:id/menu_button']"
      class: android.widget.ImageButton
  
  # 设备设置
  device_setup:
    enable_usb_debugging: true
    unlock_device: true
    grant_permissions: [ ACCESS_FINE_LOCATION, CAMERA, STORAGE ]
  
  # 日志设置
  logging:
    capture_screenshots: true
    log_commands: true
    log_performance: true

# 通用测试设置
generic_test_settings:
  retry_count: 2
  test_timeout: 120
  screenshot_dir: /reports/screenshots/app
  video_recording: false
  save_device_logs: true
  performance_monitoring: false