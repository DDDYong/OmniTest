# OmniTest 默认配置文件
# 所有环境共享的基础配置项

# 日志配置
log:
  dir: ./logs
  level: DEBUG
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_max_bytes: 10485760
  file_backup_count: 5

# 报告配置
report:
  dir: ./reports
  allure_report_dir: ./reports/allure-report
  allure_result_dir: ./reports/allure-results

data:
  dir: ./data
  test_data_dir: ./data/test_data


# 超时配置
timeout:
  default: 30
  page_load: 60
  implicitly_wait: 10
  explicit_wait: 20
  polling_interval: 0.5

# 重试配置
retry:
  default_count: 3
  interval: 2

# 截图配置
screenshot:
  dir: ./reports/screenshots

