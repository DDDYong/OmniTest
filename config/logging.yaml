version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - [%(levelname)s] - %(module_name)s:%(lineno)s - env=%(config_alias)s reload=%(reload)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

loggers:
  OmniTest:
    level: INFO
    handlers: [ console ]
    propagate: false

