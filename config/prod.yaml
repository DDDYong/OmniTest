# 生产环境配置文件
# OmniTest 自动化测试框架配置
# 此文件仅包含生产环境特定的配置,基础配置请参考default.yaml

# 基本配置
env: prod
name: 生产环境

# API配置 - 生产环境特定配置
api:
  # API基础URL
  base_url: http://api.example.com
  # API请求超时时间（秒）
  timeout: 20

# Web配置 - 生产环境特定配置
web:
  # Web应用基础URL
  base_url: http://web.example.com
  # 浏览器类型: chrome, firefox, edge, safari
  browser: chrome

# APP配置 - 生产环境特定配置
app:
  # Android应用包名
  package: com.example.app
  # Android应用主Activity
  activity: com.example.app.MainActivity

# 数据库配置 - 生产环境特定配置
mysql:
  default:
    host: prod-db.example.com
    user: prod_user
    password: prod_password
    db: prod_db

# SSH配置 - 生产环境特定配置
ssh:
  default:
    ssh_host: prod-ssh.example.com
    ssh_username: prod_ssh_user
    ssh_password: prod_ssh_password
    use_ssh: true

# 日志配置 - 生产环境特定配置
log:
  level: WARNING
  format: "%(asctime)s - %(name)s - %(levelname)s - [PROD] %(message)s"
  file_pattern: prod_%Y%m%d.log

# 报告配置 - 生产环境特定配置
report:
  auto_open: false

# 重试配置 - 生产环境特定配置
retry:
  default_count: 2
  interval: 3

# 性能测试配置 - 生产环境特定配置
performance:
  users: 200
  spawn_rate: 20
  run_time: 10m
  report_dir: ./reports/performance

# 超时配置 - 生产环境特定配置
timeout:
  api: 20
